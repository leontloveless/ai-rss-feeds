name: Add Feed

on:
  issues:
    # Issue-form labels can arrive after the opened event, so labeled is the
    # canonical trigger. retry-feed provides an explicit rerun mechanism.
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  add-feed:
    if: github.event.label.name == 'new-feed' || github.event.label.name == 'retry-feed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Extract URL from issue
        id: url
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/https?:\/\/[^\s<>)\]]+/);
            if (!match) {
              core.setFailed('The issue does not contain an HTTP(S) URL.');
              return '';
            }
            return match[0].replace(/[.,;]+$/, '');

      - name: Add feed deterministically
        id: add-feed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEED_SOURCE_URL: ${{ steps.url.outputs.result }}
        run: |
          set -euo pipefail
          bun run src/add-smart.ts "$FEED_SOURCE_URL" 2>&1 | tee /tmp/add-smart.log

          read_marker() {
            sed -n "s/^$1=//p" /tmp/add-smart.log | tail -1
          }

          RESULT=$(read_marker result)
          if [ -z "$RESULT" ]; then
            echo "add-smart.ts did not emit a result marker" >&2
            exit 1
          fi

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          for key in config_name feed_url native_feed_url existing_feed_url existing_config_name existing_feed_kind fallback_reason; do
            value=$(read_marker "$key")
            if [ -n "$value" ]; then
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Run checks
        if: steps.add-feed.outputs.result == 'new_generated' || steps.add-feed.outputs.result == 'new_native'
        run: |
          bun run typecheck
          bun test
          bun run readme

      - name: Verify result
        id: verify
        shell: bash
        env:
          RESULT: ${{ steps.add-feed.outputs.result }}
          CONFIG_NAME: ${{ steps.add-feed.outputs.config_name }}
          FEED_URL: ${{ steps.add-feed.outputs.feed_url }}
          EXISTING_URL: ${{ steps.add-feed.outputs.existing_feed_url }}
        run: |
          set -euo pipefail
          VERIFIED=false
          VERIFIED_URL=""

          if [ "$RESULT" = "new_generated" ]; then
            if [ -n "$CONFIG_NAME" ] && [ -f "feeds/${CONFIG_NAME}.xml" ] && grep -q '<item>' "feeds/${CONFIG_NAME}.xml"; then
              VERIFIED=true
              VERIFIED_URL="$FEED_URL"
            fi
          elif [ "$RESULT" = "new_native" ] || [ "$RESULT" = "existing" ]; then
            CHECK_URL="${EXISTING_URL:-$FEED_URL}"
            if [ -n "$CHECK_URL" ]; then
              BODY_HEAD=$(curl -sL --max-time 20 "$CHECK_URL" | head -c 2000 || true)
              if [ -z "$BODY_HEAD" ]; then
                BODY_HEAD=$(curl -skL --max-time 20 "$CHECK_URL" | head -c 2000 || true)
              fi
              if echo "$BODY_HEAD" | grep -qE '<\?xml|<rss|<feed'; then
                VERIFIED=true
                VERIFIED_URL="$CHECK_URL"
              fi
            fi
          elif [ "$RESULT" = "agentic_fallback" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "feed_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "feed_url=$VERIFIED_URL" >> "$GITHUB_OUTPUT"
          if [ "$VERIFIED" != "true" ]; then
            echo "The deterministic result could not be verified." >&2
            exit 1
          fi

      - name: Publish native feed or open generated-feed draft
        id: pr
        if: >-
          steps.verify.outputs.verified == 'true' &&
          (steps.add-feed.outputs.result == 'new_generated' || steps.add-feed.outputs.result == 'new_native')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_NAME: ${{ steps.add-feed.outputs.config_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_URL: ${{ steps.url.outputs.result }}
          RESULT: ${{ steps.add-feed.outputs.result }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
        run: |
          set -euo pipefail
          BRANCH="feed/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "ai-rss-feeds[bot]"
          git config user.email "ai-rss-feeds[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if [ "$RESULT" = "new_native" ]; then
            git add "configs/${CONFIG_NAME}.json" README.md
          else
            git add configs/ feeds/ cache/ README.md
          fi
          git commit -m "feat: add ${CONFIG_NAME} feed"
          git push origin "HEAD:$BRANCH"

          export BRANCH
          export HEAD_SHA="$(git rev-parse HEAD)"
          bash .github/scripts/publish-feed-pr.sh

      - name: Report result
        uses: actions/github-script@v8
        env:
          RESULT: ${{ steps.add-feed.outputs.result }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          FEED_URL: ${{ steps.verify.outputs.feed_url }}
          EXISTING_CONFIG: ${{ steps.add-feed.outputs.existing_config_name }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PUBLISHED: ${{ steps.pr.outputs.published }}
        with:
          script: |
            const result = process.env.RESULT;
            const verified = process.env.VERIFIED === 'true';
            const feedUrl = process.env.FEED_URL || '';
            const existingConfig = process.env.EXISTING_CONFIG || '';
            const prUrl = process.env.PR_URL || '';
            const published = process.env.PUBLISHED === 'true';

            let body;
            let closeIssue = false;
            if (result === 'existing' && verified) {
              body = `✅ Feed already exists${existingConfig ? ` as \`${existingConfig}\`` : ''}.\n\n📖 Subscribe: \`${feedUrl}\``;
              closeIssue = true;
            } else if (result === 'new_native' && verified && prUrl && published) {
              body = `✅ Native RSS/Atom feed discovered, verified, and added automatically.\n\n📖 Subscribe: ${feedUrl}\n\n${prUrl}`;
              closeIssue = true;
            } else if (result === 'new_generated' && verified && prUrl) {
              body = `✅ Deterministic generation and validation passed. A draft pull request is ready for review:\n\n${prUrl}\n\nThe issue will close automatically after the PR is merged.`;
            } else if (result === 'agentic_fallback') {
              body = 'ℹ️ No native RSS/Atom feed was found, so the deterministic workflow stopped without changing the repository. For this complex page, apply the `agentic-feed` label or manually run **Add Feed (Agentic Trial)**.';
            } else {
              core.setFailed(`Unexpected workflow result: ${result}`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            if (closeIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

            if (verified) {
              for (const label of ['feed-failed', 'retry-feed', 'agentic-feed']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: label,
                  });
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
              }
            } else if (result === 'agentic_fallback') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: 'retry-feed',
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try {
              const log = fs.readFileSync('/tmp/add-smart.log', 'utf8');
              const fatal = log.split('\n').find(line => line.startsWith('Fatal:'));
              if (fatal) detail = `\n\n\`${fatal}\``;
            } catch (_) {}

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ The deterministic add-feed workflow failed.${detail}\n\nThe issue remains open; inspect the workflow log before retrying.`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['feed-failed'],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'retry-feed',
              });
            } catch (err) {
              if (err.status !== 404) throw err;
            }
